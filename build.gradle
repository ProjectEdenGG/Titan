import java.text.SimpleDateFormat

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "io.freefair.lombok" version "9.5.0"
	id "com.modrinth.minotaur" version "2.9.0"
}

version = 'git rev-parse --short HEAD'.execute().text.trim()
group = project.maven_group

repositories {
	mavenCentral()

	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.projecteden.gg/repo" }
	maven { url "https://repo.eclipse.org/content/groups/releases/" }
	maven { url "https://jitpack.io" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation include("net.lingala.zip4j:zip4j:2.11.1") {
		transitive(true)
	}

	implementation include("org.eclipse.jgit:org.eclipse.jgit:6.5.0.202303070854-r") {
		transitive(true)
	}

	implementation ("com.terraformersmc:modmenu:${project.modmenu_version}") {
		exclude (group: "net.fabricmc.fabric-api")
	}

	implementation include ("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
		exclude (group: "net.fabricmc.fabric-api")
	}

	implementation include("com.github.JnCrMx:discord-game-sdk4j:v0.5.5")

	implementation include("org.apache.httpcomponents.client5:httpclient5:5.5.1")
	implementation include("org.apache.httpcomponents.core5:httpcore5:5.3")
	implementation include("org.apache.httpcomponents.core5:httpcore5-h2:5.3")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	archiveFileName = "titan.jar"

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}

	manifest {
		attributes(
			'Build-Timestamp': new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS").format(new Date())
		)
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "f44hEoWP"
	versionNumber = project.version
	uploadFile = jar
	gameVersions = ["${minecraft_version}"]
	loaders = ["fabric"]
	uploadFile = "./build/libs/titan.jar"
	dependencies {
		required.project "fabric-api"
		required.project "cloth-config"
		required.project "modmenu"
	}
}
